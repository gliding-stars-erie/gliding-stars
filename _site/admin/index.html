<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager | Gliding Stars of Erie</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Prevent Decap CMS from auto-initializing so we can register our custom widget first -->
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Custom YouTube embed widget.
    // Editors can paste the full <iframe> embed code from YouTube or just the URL.
    // The widget extracts and saves only the embed URL either way.
    (function () {
      var React = window.React;
      var useState = React.useState;
      var h = React.createElement;

      function extractYouTubeUrl(text) {
        if (!text) return '';
        // If it looks like an iframe tag, pull out the src attribute value
        var match = text.match(/src=["']([^"']*youtube[^"']+)["']/i);
        return match ? match[1] : text.trim();
      }

      function YoutubeEmbedControl(props) {
        var state = useState(props.value || '');
        var inputVal = state[0];
        var setInputVal = state[1];

        function handleChange(e) {
          var raw = e.target.value;
          setInputVal(raw);
          props.onChange(extractYouTubeUrl(raw));
        }

        return h('div', null,
          h('textarea', {
            style: {
              width: '100%', height: '90px', fontFamily: 'monospace',
              fontSize: '12px', padding: '8px', boxSizing: 'border-box',
              borderRadius: '5px', border: '1px solid #ddd', resize: 'vertical'
            },
            placeholder: 'Paste the full YouTube <iframe> embed code OR just the URL — the URL will be extracted automatically.',
            value: inputVal,
            onChange: handleChange
          }),
          h('p', {
            style: {fontSize: '12px', color: props.value ? '#444' : '#999', marginTop: '6px'}
          },
            props.value
              ? h('span', null, 'Saved URL: ', h('code', {
                  style: {background: '#f4f4f4', padding: '2px 5px', borderRadius: '3px', wordBreak: 'break-all'}
                }, props.value))
              : 'No video set.'
          )
        );
      }

      CMS.registerWidget('youtube-embed', YoutubeEmbedControl);
      CMS.init();
    })();
  </script>
</body>
</html>
